<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>КубБанк — цифровой банк</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <meta name="description" content="КубБанк — современное SPA (LocalStorage) demo" />
</head>
<body>
  <div id="app">
    <header class="topbar" role="banner">
      <div class="brand">КубБанк</div>
      <nav id="nav" class="nav" role="navigation"></nav>
    </header>

    <main id="main" class="container" role="main"></main>

    <aside id="sidebar" class="sidebar" role="complementary" aria-label="Sidebar">
      <section class="panel" aria-live="polite">
        <h3>Уведомления</h3>
        <div id="notifications" class="notifs"></div>
      </section>

      <section class="panel">
        <h3>Доска объявлений</h3>
        <div id="announcements-short"></div>
        <div style="margin-top:8px"><button id="view-announcements" class="btn secondary">Полная доска</button></div>
      </section>

      <section class="panel">
        <h3>Настройки</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="toggle-theme" class="btn ghost">Тема</button>
          <button id="toggle-lang" class="btn ghost">RU/EN</button>
          <button id="open-backup" class="btn ghost">Экспорт/Импорт</button>
        </div>
      </section>
    </aside>

    <footer class="footer" role="contentinfo">
      <div>© КубБанк — демонстрационный интерфейс. Данные хранятся в вашем браузере.</div>
    </footer>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
